{% extends "base.html" %}
{% load static %}
{% block title %}Tag cloud{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Tag cloud</h1>
<div id="tag-cloud" style="max-width:800px"></div>
{% endblock %}

{% block scripts %}
{{block.super}}
<script src="{% static "lib/d3/d3.min.js" %}"></script>
<script src="{% static "lib/d3/d3.layout.cloud.js" %}"></script>
<script>
  var fill = d3.scale.category20();

  d3.layout.cloud().size([500, 500])
      .words([
        "Hello", "world", "normally", "you", "want", "more", "words",
        "than", "this", "but", "I", "can", "continue", "to", "add",'many', 'more','things'].map(function(d) {
        return {text: d, size: 10 + Math.random() * 90};
      }))
      .padding(5)
      .rotate(function() { return ~~(Math.random() * 2) * 90; })
      .font("Impact")
      .fontSize(function(d) { return d.size; })
      .on("end", draw)
      .start();

  function draw(words) {
    /* SVG is decorative-with-meaning: expose it as a single labelled image
       (WCAG 1.1.1) rather than letting AT walk dozens of rotated <text> nodes. */
    var svg = d3.select("#tag-cloud").append("svg")
        .attr("width", 800)
        .attr("height", 800)
        .attr("role", "img")
        .attr("aria-label", "Tag cloud of the most-used share tags, sized by frequency.");
    svg.append("title").text("Tag cloud of the most-used share tags, sized by frequency.");
    svg.append("g")
        .attr("transform", "translate(150,150)")
      .selectAll("text")
        .data(words)
      .enter().append("text")
        .attr("aria-hidden", "true")
        .style("font-size", function(d) { return d.size + "px"; })
        .style("font-family", "Impact")
        .style("fill", function(d, i) { return fill(i); })
        .attr("text-anchor", "middle")
        .attr("transform", function(d) {
          return "translate(" + [d.x, d.y] + ")rotate(" + d.rotate + ")";
        })
        .text(function(d) { return d.text; });
  }
</script>
{% endblock%}
