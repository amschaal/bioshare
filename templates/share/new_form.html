{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Create a share{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Create a new share</h1>

<form method="POST" action="" class="border rounded bg-white p-3">
    {% csrf_token %}
    {% crispy form %}
    <button type="submit" class="btn btn-primary">Create share</button>
</form>
{% endblock %}
