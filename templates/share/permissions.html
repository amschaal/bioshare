{% extends "base.html" %}
{% load static %}
{% block title %}Permissions: {{ share.name }}{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
    <h1 class="m-0 h3">
        Permissions:
        <a href="{% url 'list_directory' share.slug_or_id %}">{{ share.name }}</a>
    </h1>
</div>

{% comment %}Init payload for pages/permissions.js.{% endcomment %}
<script id="permissions-init" type="application/json">{
    "readOnly": {{ share.read_only|yesno:"true,false" }},
    "secure": {{ share.secure|yesno:"true,false" }},
    "urls": {
        "getPermissions": "{% url 'api_get_permissions' share=share.id %}",
        "setPermissions": "{% url 'api_set_permissions' share=share.id %}",
        "shareWith": "{% url 'api_share_with' share=share.id %}",
        "updateShare": "{% url 'api_update_share' share=share.id %}"
    }
}</script>

<div id="permissions-page-mount"></div>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script type="module" src="{% static 'js/app/pages/permissions.js' %}"></script>
{% endblock %}
