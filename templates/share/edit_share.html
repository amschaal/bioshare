{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit share{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Edit share</h1>

<form method="POST" action="" class="border rounded bg-white p-3">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save changes</button>
</form>
{% endblock %}
