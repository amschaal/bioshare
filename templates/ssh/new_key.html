{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Add an SSH public key{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Add an SSH public key</h1>

<form enctype="multipart/form-data" method="POST" action="" class="border rounded bg-white p-3" style="max-width: 40rem;">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Create</button>
</form>
{% endblock %}
