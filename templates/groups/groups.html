{% extends "base.html" %}
{% load static %}
{% block title %}Groups{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
    <h1 class="m-0 h3">Groups</h1>
    {% if request.user.is_staff %}
    <a href="{% url 'create_group' %}" class="btn btn-sm btn-success">
        <i class="bi bi-plus-lg" aria-hidden="true"></i> Create group
    </a>
    {% endif %}
</div>

<div id="groups-page-mount"></div>
{% endblock %}

{% block scripts %}
{{ block.super }}
<script type="module" src="{% static 'js/app/pages/groups.js' %}"></script>
{% endblock %}
