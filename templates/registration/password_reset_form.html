{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load i18n %}
{% block title %}{% trans "Password reset" %}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-7 col-lg-6">
    <h1 class="h3 mb-3">{% trans "Password reset" %}</h1>
    <form method="post" action="" class="border rounded bg-white p-3">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary">{% trans 'Submit' %}</button>
    </form>
  </div>
</div>
{% endblock %}
