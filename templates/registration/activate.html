{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Account activation" %}{% endblock %}

{% block content %}
{% if account %}
<h1 class="h3">{% trans "Account successfully activated" %}</h1>
<p><a href="{% url 'login' %}">{% trans "Log in" %}</a></p>
{% else %}
<h1 class="h3">{% trans "Account activation failed" %}</h1>
{% endif %}
{% endblock %}
