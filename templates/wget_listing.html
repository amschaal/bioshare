{% block title %}Share: {{share.name}} {{subdir}}{% endblock %}
  <table>
  <thead><tr><th scope="col">Name</th></tr></thead>
  <tbody>
  {% for dir in directories %}
    <tr class="directory real-directory"><td class="name"><a href="{{dir}}/wget_index.html">{{ dir }}/</a></td></tr>
  {% endfor %}
  {% for file in files %}
    <tr class="file"><td class="name"><a href="{% url 'wget_download_file' share=share.id subpath=subdir|default_if_none:""|add:file %}">{{ file }}</a></td></tr>
  {% endfor %}
  </tbody>
  </table>
